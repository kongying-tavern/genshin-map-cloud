include:
  - _network.yml
  - dataenv.yml

services:
  api-builder:
    container_name: gsapi-api-builder
    hostname: gsapi-api-builder
    image: gsapi/api-builder
    build:
      context: ${PROJECT_BASE:-../../}
      dockerfile: docker/composer/api.api-builder.Dockerfile
      args:
        - BUILD_PROFILE=${BUILD_PROFILE:-dev}
  api-gateway:
    container_name: gsapi-api-gateway
    hostname: gsapi-api-gateway
    image: gsapi/api-gateway
    build:
      context: ${PROJECT_BASE:-../../}
      dockerfile: docker/composer/api.api-gateway.Dockerfile
      additional_contexts:
        api-builder: service:api-builder
    depends_on:
      api-builder:
        condition: service_started
      nacos:
        condition: service_healthy
    networks:
      gsapi-api:
        aliases:
          - api-gateway.local
    volumes:
      - ${DATA_DIR}/api/logs/gateway:/data/logs
    ports:
      - ${GATEWAY_PORT:-8101}:8101
    restart: always
  api-core:
    container_name: gsapi-api-core
    hostname: gsapi-api-core
    image: gsapi/api-core
    build:
      context: ${PROJECT_BASE:-../../}
      dockerfile: docker/composer/api.api-core.Dockerfile
      additional_contexts:
        api-builder: service:api-builder
    depends_on:
      api-builder:
        condition: service_started
      postgresql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      gsapi-api:
        aliases:
          - api-core.local
      gsapi-img-alist:
        aliases:
          - img-alist.local
    environment:
      # JWT 密钥库路径与口令：密钥库以只读文件方式挂载，不再内置在镜像中
      - OAUTH2_JKS_LOCATION=${OAUTH2_JKS_LOCATION:-file:/data/secrets/oauth2.jks}
      - OAUTH2_JKS_PASSWORD=${OAUTH2_JKS_PASSWORD:?OAUTH2_JKS_PASSWORD is required, see docker/.env.example}
    volumes:
      - ${DATA_DIR}/api/logs/core:/data/logs
      - ${DATA_DIR}/api/secrets:/data/secrets:ro
    # api-core 自身不校验鉴权（WebSecurityConfiguration 对 /api/**、/system/** permitAll），
    # 鉴权的唯一边界是网关，因此这里只绑定回环地址，禁止从宿主机外部直连。
    ports:
      - "127.0.0.1:${API_PORT:-8092}:8092"
    restart: always
