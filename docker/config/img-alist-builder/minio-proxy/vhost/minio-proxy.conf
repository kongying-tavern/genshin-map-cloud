server
{
    listen 80;
    index index.php index.html index.htm default.php default.htm default.html;
    root /data;

    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 http://$host$request_uri;

    # 引用反向代理规则
    include proxy/minio-proxy.conf;

    # 禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known
    {
        allow all;
    }

    # 禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" )
    {
        return 403;
    }

    # 图片处理
    set $uri2 $uri;

    location ~ .*\.(webp)$
    {
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://minio.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors on;
        if ( $uri2 ~* \.jpg$ )
        {
            error_page 404 = @jpg2png;
        }
        error_page 404 = @other;
    }

    location @other
    {
        rewrite ^(.*) $uri2 break;
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://minio.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location @jpg2png
    {
        rewrite ^/(.*)\.\w+$ /$1.png break;
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://minio.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    location ~ .*\.(jpg|jpeg|png|jfif)$ {
        expires 1d;
        set $flag 0;
        # 判断来源设备是否支持webp
        if ( $http_accept ~* '(image/webp)' )
        {
            set $flag "${flag}1";
        }
        if ( $http_accept = '*' )
        {
            set $flag "${flag}1";
        }
        if ( $http_accept = '*/*' )
        {
            set $flag "${flag}1";
        }
        if ( $request_method ~* 'GET' )
        {
            # 判断来源是否是 GET
            set $flag "${flag}2";
        }
        if ( $flag = "012" )
        {
            rewrite ^/(.*)\.\w+$ /$1.webp last;
        }
        proxy_set_header 'Access-Control-Allow-Origin' '*';
        proxy_pass http://minio.local:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        proxy_ssl_server_name off;
        proxy_ssl_name $proxy_host;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        if ( $uri ~* \.jpg$ )
        {
            rewrite ^/(.*)\.\w+$ /$1.png last;
        }
    }

    location ~ .*\.(js|css)?$
    {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /dev/null;
    error_log /data/log/minio-proxy.local-error.log;
}
