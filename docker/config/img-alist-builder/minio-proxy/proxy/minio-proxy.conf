# 默认转发所有未匹配其他 location 的请求到 MinIO
location /
{
    # MinIO 鉴权相关 headers 必须传递
    proxy_set_header Authorization $http_authorization;

    proxy_set_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://minio.local:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control no-cache;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}

location ~ .*\.(webp)$
{
    set $uri2 $uri;

    # MinIO 鉴权相关 headers 必须传递
    proxy_set_header Authorization $http_authorization;

    proxy_set_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://minio.local:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control no-cache;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_intercept_errors on;
    if ( $uri2 ~* \.jpg$ )
    {
        error_page 404 = @jpg2png;
    }
    error_page 404 = @other;
}

location @other
{
    rewrite ^(.*) $uri2 break;

    # MinIO 鉴权相关 headers 必须传递
    proxy_set_header Authorization $http_authorization;

    proxy_set_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://minio.local:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control no-cache;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}

location @jpg2png
{
    rewrite ^/(.*)\.\w+$ /$1.png break;

    # MinIO 鉴权相关 headers 必须传递
    proxy_set_header Authorization $http_authorization;

    proxy_set_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://minio.local:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control no-cache;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
}

location ~ .*\.(jpg|jpeg|png|jfif)$ {
    expires 1d;
    set $flag 0;
    # 判断来源设备是否支持 webp
    if ( $http_accept ~* '(image/webp)' )
    {
        set $flag "${flag}1";
    }
    if ( $http_accept = '*' )
    {
        set $flag "${flag}1";
    }
    if ( $http_accept = '*/*' )
    {
        set $flag "${flag}1";
    }
    if ( $request_method ~* 'GET' )
    {
        # 判断来源是否是 GET
        set $flag "${flag}2";
    }
    if ( $flag = "012" )
    {
        rewrite ^/(.*)\.\w+$ /$1.webp last;
    }

    # MinIO 鉴权相关 headers 必须传递
    proxy_set_header Authorization $http_authorization;

    proxy_set_header 'Access-Control-Allow-Origin' '*';
    proxy_pass http://minio.local:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Cache $upstream_cache_status;
    add_header Cache-Control no-cache;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    if ( $uri ~* \.jpg$ )
    {
        rewrite ^/(.*)\.\w+$ /$1.png last;
    }
}
